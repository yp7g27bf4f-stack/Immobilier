<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImmoMémo — Memory Immobilier</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#f8fbff);color:#17324d}
.container{max-width:1000px;margin:auto;padding:28px 18px;text-align:center}
h1{margin:8px 0 4px;font-size:clamp(2rem,6vw,3.5rem)} .subtitle{margin:0 0 18px;color:#60758a}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:white;border-radius:14px;padding:10px 18px;box-shadow:0 5px 18px #17324d18}
button{border:0;border-radius:12px;padding:11px 18px;background:#17324d;color:white;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}.game{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:20px auto}
.card{aspect-ratio:1;border:0;background:transparent;padding:0;perspective:800px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;box-shadow:0 5px 16px #17324d20}
.back{background:#17324d;color:white;font-size:2.4rem}
.front{background:white;transform:rotateY(180deg);font-size:clamp(2.2rem,6vw,3.5rem)}
.matched .front{outline:4px solid #58b58b}
#message{min-height:28px;font-weight:bold;margin:12px}
@media(max-width:650px){.game{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="container">
  <h1>🏠 ImmoMémo</h1>
  <p class="subtitle">Le Memory 100 % immobilier</p>
  <div class="stats">
    <div class="stat">Coups : <strong id="moves">0</strong></div>
    <div class="stat">Paires : <strong id="pairs">0</strong>/8</div>
    <div class="stat">Temps : <strong id="time">0</strong>s</div>
    <button onclick="newGame()">Nouvelle partie</button>
  </div>
  <div id="message"></div>
  <div id="game" class="game"></div>
</div>

<script>
const symbols=["🏠","🏢","🔑","🏡","🏗️","📐","🪴","🛋️"];
let first=null, second=null, locked=false, moves=0, pairs=0, seconds=0, timer=null;

function newGame(){
  clearInterval(timer); first=null; second=null; locked=false;
  moves=0;pairs=0;seconds=0;
  document.getElementById("moves").textContent=0;
  document.getElementById("pairs").textContent=0;
  document.getElementById("time").textContent=0;
  document.getElementById("message").textContent="";
  const cards=[...symbols,...symbols].sort(()=>Math.random()-.5);
  const game=document.getElementById("game");
  game.innerHTML="";
  cards.forEach((symbol,i)=>{
    const card=document.createElement("button");
    card.className="card";
    card.dataset.symbol=symbol;
    card.innerHTML=`<div class="card-inner">
      <div class="face back">🏘️</div>
      <div class="face front">${symbol}</div>
    </div>`;
    card.onclick=()=>flip(card);
    game.appendChild(card);
  });
  timer=setInterval(()=>{seconds++;document.getElementById("time").textContent=seconds},1000);
}

function flip(card){
  if(locked || card===first || card.classList.contains("matched")) return;
  card.classList.add("flipped");
  if(!first){first=card;return}
  second=card;moves++;
  document.getElementById("moves").textContent=moves;
  if(first.dataset.symbol===second.dataset.symbol){
    first.classList.add("matched");second.classList.add("matched");
    pairs++;document.getElementById("pairs").textContent=pairs;
    first=null;second=null;
    if(pairs===symbols.length){
      clearInterval(timer);
      document.getElementById("message").textContent=`🎉 Bravo ! Partie terminée en ${moves} coups et ${seconds} secondes.`;
    }
  }else{
    locked=true;
    setTimeout(()=>{
      first.classList.remove("flipped");second.classList.remove("flipped");
      first=null;second=null;locked=false;
    },850);
  }
}
newGame();
</script>
</body>
</html>
